[project]
name = "pulsara-agent"
version = "0.1.0"
description = "Pulsara canonical conversation-kernel agent runtime."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12,<4",
    "httpx>=0.28.1,<1",
    "jsonschema>=4.26,<5",
    "jieba==0.42.1",
    "openai>=3.26.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "protobuf>=6.31.1",
    "google-re2>=1.1.20240702",
    "mcp[cli]==2.1.0",
    "mcp-types==2.1.0",
    "pillow>=12.3.0",
    "playwright>=1.58,<2",
    "wcmatch==10.1",
    "python-dateutil==2.9.0.post0",
    "tzdata>=2026.2",
    "httpx2>=2.12.0,<3",
]

[project.scripts]
pulsara = "pulsara_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulsara_agent"]
exclude = ["src/pulsara_agent/_vendor/ripgrep"]

[tool.hatch.build.targets.sdist]
# Hatch reads the root VCS ignores, not frontend/.gitignore.
exclude = ["src/pulsara_agent/_vendor/ripgrep", "frontend/node_modules"]

[tool.hatch.build.hooks.custom]
path = "tools/hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: integration tests that require a fresh migrated PostgreSQL database",
    "retrieval_live: opt-in tests that call live retrieval-side model APIs",
]

[tool.ruff]
extend-exclude = [
    "src/pulsara_agent/terminal_protocol/generated_v3/terminal_kernel_v3_pb2.py",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.16",
    "hatchling>=1.32.4,<2",
    "editables>=0.5,<1",
]
