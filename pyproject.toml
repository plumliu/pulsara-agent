[project]
name = "pulsara-agent"
version = "0.1.0"
description = "Pulsara canonical conversation-kernel agent runtime."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jieba==0.42.1",
    "openai>=2.43.0",
    "prompt-toolkit>=3.0.52",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "protobuf>=6.31.1",
    "mcp[cli]==2.0.0",
    "mcp-types==2.0.0",
]

[project.scripts]
pulsara = "pulsara_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulsara_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: integration tests that require a fresh migrated PostgreSQL database",
    "retrieval_live: opt-in tests that call live retrieval-side model APIs",
]

[tool.ruff]
extend-exclude = [
    "src/pulsara_agent/terminal_protocol/generated_v3/terminal_kernel_v3_pb2.py",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.16",
]
