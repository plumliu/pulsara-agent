name: Ubuntu Backend and Package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      CI: "true"
      PULSARA_POSTGRES_ADMIN_DSN: postgresql://pulsara_admin:pulsara_admin@127.0.0.1:5432/pulsara
      PULSARA_POSTGRES_DSN: postgresql://pulsara_runtime:pulsara_runtime@127.0.0.1:5432/pulsara
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pulsara
          POSTGRES_USER: pulsara_admin
          POSTGRES_PASSWORD: pulsara_admin
          PULSARA_RUNTIME_DB_USER: pulsara_runtime
          PULSARA_RUNTIME_DB_PASSWORD: pulsara_runtime
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulsara_admin -d pulsara"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install Python and build tools
        run: |
          uv python install 3.12
          sudo apt-get update
          sudo apt-get install -y binutils
      - name: Prepare pinned private ripgrep
        run: uv run --no-project --python 3.12 python tools/prepare_ripgrep.py
      - name: Install editable application and test dependencies
        run: uv sync --locked --dev
      - name: Prepare Chromium with Ubuntu dependencies
        run: uv run --no-sync python -m playwright install --with-deps chromium
      - name: Initialize PostgreSQL runtime role
        run: docker exec -i "${{ job.services.postgres.id }}" bash -s < docker/postgres-init/001-runtime-role.sh
      - name: Ruff and complete Python test suite
        run: |
          uv run --no-sync ruff check
          uv run --no-sync python -m pytest -q -n 4
      - name: Build offline wheel and source archive
        run: uv build --offline --no-build-isolation --sdist --wheel
      - name: Install wheel into isolated environment and smoke test outside checkout
        shell: bash
        run: |
          smoke_env="$RUNNER_TEMP/pulsara-wheel-env"
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/wheel-constraints.txt" > /dev/null
          uv venv --python 3.12 "$smoke_env"
          uv pip install --python "$smoke_env/bin/python" --constraint "$RUNNER_TEMP/wheel-constraints.txt" dist/*.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$smoke_env/bin/python" "$GITHUB_WORKSPACE/tests/linux/installed_package_smoke.py"
      - uses: actions/upload-artifact@v7
        with:
          name: pulsara-${{ matrix.runner }}
          path: dist/*
