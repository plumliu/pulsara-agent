name: Native Desktop Packages

on:
  workflow_dispatch:
  pull_request:
    paths: ['desktop/**', 'frontend/**', 'src/**', 'tests/**', 'pyproject.toml', 'uv.lock', 'tools/prepare_ripgrep.py', '.github/workflows/desktop-package.yml', '.github/workflows/ubuntu-tests.yml']
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify committed release versions
        shell: bash
        run: |
          uv python install 3.12
          uv sync --locked --dev --no-install-project
          args=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          uv run --no-sync python desktop/scripts/release_artifacts.py check "${args[@]}"
      - name: Frontend regression, types and lint
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          frontend/node_modules/.bin/tsc --noEmit -p frontend/tsconfig.json
          npm --prefix frontend run lint

  backend:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ubuntu-tests.yml
    permissions:
      contents: read

  package:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Native build tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex pkg-config binutils patchelf libopenblas0
      - name: Native build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bison flex dylibbundler
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Prepare Python and application dependencies
        run: |
          uv python install 3.12
          uv run --no-project --python 3.12 python tools/prepare_ripgrep.py
          uv sync --locked --dev
      - name: Chromium OS dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: uv run --no-sync python -m playwright install-deps chromium
      - name: Build the desktop renderer and shell
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build:desktop
          npm --prefix desktop ci
          npm --prefix desktop test
          node --test desktop/scripts/linux-hooks.test.cjs
      - name: Verify native Linux dependency collection
        if: runner.os == 'Linux'
        run: uv run --no-sync python desktop/scripts/test_linux_dependencies.py
      - name: Build pinned native resources and verify relocation
        run: |
          uv run --no-sync python desktop/scripts/prepare_resources.py
          uv run --no-sync python desktop/scripts/smoke_resources.py
          uv run --no-sync python desktop/scripts/release_artifacts.py check --resources desktop/resources
      - name: Package native installer
        run: npm --prefix desktop run package -- --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Install Debian package and verify command ownership
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./desktop/release/*.deb
          test "$(readlink /usr/bin/pulsara)" = /opt/Pulsara/resources/bin/pulsara
          /usr/bin/pulsara --help
          expected_version=$(uv run --no-sync python -c 'from pulsara_agent import __version__; print(__version__)')
          test "$(/usr/bin/pulsara --version)" = "$expected_version"
          /usr/bin/pulsara-desktop --pulsara-cli --help
          test "$(/usr/bin/pulsara-desktop --pulsara-cli --version)" = "$expected_version"
          sudo apt-get remove -y pulsara-desktop
          test ! -L /usr/bin/pulsara
      - uses: actions/upload-artifact@v7
        with:
          name: pulsara-desktop-${{ matrix.runner }}-${{ matrix.arch }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.deb
          if-no-files-found: error

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, backend, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-draft-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/download-artifact@v8
        with:
          pattern: pulsara-desktop-*
          path: release-input
      - name: Assemble and upload a prerelease draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv python install 3.12
          uv sync --locked --dev --no-install-project
          uv run --no-sync python desktop/scripts/release_artifacts.py draft --tag "$GITHUB_REF_NAME" --artifacts release-input --output release-assets --repository "$GITHUB_REPOSITORY"
