name: Advisory Memory Contract

on:
  workflow_dispatch:

jobs:
  recall-eval:
    runs-on: ubuntu-latest
    # This gate tests Python source, not the platform application wheel.
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    services:
      postgres:
        image: paradedb/paradedb:0.26.1-pg17
        env:
          POSTGRES_DB: pulsara
          POSTGRES_USER: pulsara_admin
          POSTGRES_PASSWORD: pulsara_admin
          PULSARA_RUNTIME_DB_USER: pulsara_runtime
          PULSARA_RUNTIME_DB_PASSWORD: pulsara_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsara_admin -d pulsara"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install Python
        run: uv python install 3.12
      - name: Sync dev dependencies
        run: uv sync --locked --dev --no-install-project
      - name: Ruff
        run: uv run --no-sync ruff check
      - name: Initialize PostgreSQL runtime role
        run: docker exec -i "${{ job.services.postgres.id }}" bash -s < docker/postgres-init/001-runtime-role.sh
      - name: Advisory memory contract gate
        env:
          PULSARA_POSTGRES_ADMIN_DSN: "postgresql://pulsara_admin:pulsara_admin@127.0.0.1:5432/pulsara"
          PULSARA_POSTGRES_DSN: "postgresql://pulsara_runtime:pulsara_runtime@127.0.0.1:5432/pulsara"
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_direct_advisory_memory.py
          tests/test_direct_memory_preference_refresh.py
          tests/test_direct_memory_prompt_contract.py
          tests/test_direct_memory_related_fallback.py
          tests/test_memory_management_contracts.py
          tests/test_memory_tool_result_rejection.py
          tests/test_desktop_memory_management.py
