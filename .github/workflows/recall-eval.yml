name: Advisory Memory Contract

on:
  pull_request:
    paths:
      - "src/pulsara_agent/memory/**"
      - "src/pulsara_agent/conversation_kernel/memory/**"
      - "src/pulsara_agent/conversation_kernel/memory_tools.py"
      - "src/pulsara_agent/storage/migrations/**"
      - "tests/test_memory_*"
      - "tests/test_round8_advisory_memory.py"
      - ".github/workflows/recall-eval.yml"
  push:
    branches:
      - main

jobs:
  recall-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python
        run: uv python install 3.12
      - name: Sync dev dependencies
        run: uv sync --dev
      - name: Ruff
        run: uv run ruff check
      - name: Advisory memory contract gate
        run: >-
          uv run pytest -q
          tests/test_memory_governance_semantics.py
          tests/test_round8_advisory_memory.py
