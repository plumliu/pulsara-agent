        const x1=p.x+158,y1=p.y+54,x2=n.x,y2=n.y+54;
        const path='M'+x1+','+y1+' C'+((x1+x2)/2)+','+y1+' '+((x1+x2)/2)+','+y2+' '+x2+','+y2;
        const selected=n.id===selectedNode||p.id===selectedNode;
        const base='<path class="edge '+(selected?'selected':'')+'" d="'+path+'" marker-end="url(#'+(selected?'arrow-selected':'arrow')+')"/>';
        // Direction is prerequisite -> dependent, never a claim of live execution.
        const flow=selected?[0,-.95].map(delay=>'<g class="edge-flow"><path d="M-6 -4 L-1 0 L-6 4"/><animateMotion path="'+path+'" dur="1.9s" begin="'+delay+'s" rotate="auto" calcMode="paced" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.82;1" dur="1.9s" begin="'+delay+'s" repeatCount="indefinite"/></g>').join(''):'';
        return base+flow;
      })).join('');
      const markers='<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z"/></marker><marker id="arrow-selected" class="selected-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>';
      canvas.innerHTML='<svg class="graph-edges" viewBox="0 0 840 410" aria-hidden="true">'+markers+edges+'</svg>'+activeGroup.nodes.map((n,i)=>'<button class="graph-node" data-node="'+n.id+'" style="left:'+n.x+'px;top:'+n.y+'px" aria-pressed="'+(selectedNode===n.id)+'" aria-label="'+n.name+'，'+labels[n.status]+'"><span class="graph-node-top"><span>'+String(i+1).padStart(2,'0')+'</span>'+icon(n.status==='running'?'progress':n.status==='completed'?'check':n.status==='waiting'?'clock':'warning',n.status==='running'?'node-running-icon':'')+'</span><strong>'+n.name+'</strong><span class="graph-node-status '+n.status+'">'+(n.status==='running'?'<i class="state-dot"></i>':'')+labels[n.status]+'</span></button>').join('');
      // Restart this selection's SVG clock while keeping the two arrows staggered.
      canvas.querySelector('.graph-edges').setCurrentTime(0);
      renderNodeConversation();
    }
    function renderNodeConversation(){
      const panel=document.getElementById('node-conversation');
      const n=activeGroup.nodes.find(item=>item.id===selectedNode);
      const entering=panel.hidden&&Boolean(n);
      panel.classList.toggle('is-entering',entering);
      panel.hidden=!n;document.querySelector('.dialog-main').classList.toggle('has-selection',Boolean(n));
      if(!n){panel.innerHTML='';return;}
      const waiting=['waiting','blocked'].includes(n.status);
      const entries=waiting?[]:(transcripts[n.id]||[{kind:'assistant',body:n.progress}]);
      const messages=entries.map(entry=>entry.kind==='tool'?'<div class="node-tool'+(entry.failed?' tool-failed':'')+'"><span>'+icon(entry.failed?'warning':'check')+esc(entry.name)+' · '+esc(entry.path)+'</span><pre>'+esc(entry.body)+'</pre></div>':'<div class="assistant-head"><span class="assistant-mark">P</span><strong>'+esc(n.name)+'</strong></div><div class="assistant-body">'+esc(entry.body)+'</div>').join('');
      panel.innerHTML='<header class="node-chat-header"><h3>'+esc(n.name)+'</h3><div class="node-chat-header-actions">'+badge(n.status)+'<button class="icon-button" data-clear-node aria-label="收起子任务对话" title="收起">'+icon('close')+'</button></div></header><div class="node-messages"><div class="user-label">主助手</div><div class="user-message">'+esc(n.objective)+'</div>'+messages+(waiting?'<div class="node-state '+n.status+'">'+icon('clock')+esc(n.progress)+'</div>':n.status==='running'?'<div class="node-state running"><i class="state-dot"></i>进行中</div>':'')+'</div>'+(n.status==='running'?'<footer class="node-chat-actions"><button class="danger-button" data-demo-action="终止子任务"><span class="stop-square"></span>终止子任务</button></footer>':'');
    }
    function clearNode(){
      const lastSelected=selectedNode;selectedNode=null;renderGraph();requestAnimationFrame(applyZoom);
      if(lastSelected)canvas.querySelector('[data-node="'+lastSelected+'"]').focus({preventScroll:true});
    }
    function applyZoom(){
      const single=activeGroup.nodes.length===1,width=single?158:840,height=single?103:410;
      if(fitMode)zoom=Math.max(.25,Math.min(1,(viewport.clientWidth-40)/width,(viewport.clientHeight-40)/height));
      canvas.style.width=width+'px';canvas.style.height=height+'px';canvas.style.transform='scale('+zoom+')';const sizer=document.getElementById('canvas-sizer');sizer.style.width=width*zoom+'px';sizer.style.height=height*zoom+'px';document.getElementById('zoom-label').textContent=Math.round(zoom*100)+'%';
      document.getElementById('zoom-out').disabled=zoom<=.3;document.getElementById('zoom-in').disabled=zoom>=1.5;
    }
    function openGroup(id,button){
      activeGroup=groups.find(g=>g.id===id);selectedNode=activeGroup.nodes.length===1?activeGroup.nodes[0].id:null;fitMode=true;opener=button;
      document.getElementById('dialog-title').textContent=activeGroup.title;document.getElementById('dialog-group-label').textContent=activeGroup.number;document.getElementById('dialog-group-status').innerHTML=badge(activeGroup.status);document.getElementById('graph-count').textContent=' · '+activeGroup.nodes.length+' 个子任务';
      renderGraph();dialog.showModal();requestAnimationFrame(applyZoom);document.getElementById('close-dialog').focus();
    }
    function showDemoMessage(message){const toast=document.getElementById('toast');(dialog.open?dialog:document.body).append(toast);toast.textContent=message;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.hidden=true;},2500);}
    function showNotice(action){showDemoMessage(action+'：仅演示，未执行。');}
    function syncConversationTheme(){const root=productionConversation.contentDocument?.documentElement;if(root)root.dataset.theme=document.documentElement.dataset.theme||'light';}
    productionConversation.addEventListener('load',syncConversationTheme);
    window.addEventListener('message',event=>{
      if(event.source!==productionConversation.contentWindow||event.origin!==location.origin)return;
      if(event.data?.type==='pulsara-demo-notice'&&typeof event.data.text==='string')showDemoMessage(event.data.text);
      if(event.data?.type==='pulsara-demo-focus-tasks'&&typeof event.data.target?.id==='string')focusTaskGroup(event.data.target);
    });
    document.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button||button.disabled)return;
      if(button.dataset.openGroup)openGroup(button.dataset.openGroup,button);
      if(button.dataset.tab)switchTab(button.dataset.tab);
      if(button.dataset.cap)renderCapabilities(button.dataset.cap);
      if(button.dataset.node){selectedNode=button.dataset.node;renderGraph();requestAnimationFrame(applyZoom);canvas.querySelector('[data-node="'+selectedNode+'"]').focus({preventScroll:true});}
      if(button.hasAttribute('data-clear-node'))clearNode();
      if(button.dataset.demoAction){event.preventDefault();showNotice(button.dataset.demoAction);}
    });
    viewport.addEventListener('click',event=>{if(!event.target.closest('[data-node]')&&selectedNode!==null)clearNode();});
    document.querySelector('[role="tablist"]').addEventListener('keydown',event=>{
      if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const tabs=[...document.querySelectorAll('[data-tab]')];const index=tabs.indexOf(document.activeElement);const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;switchTab(tabs[next].dataset.tab);tabs[next].focus();
    });
    document.getElementById('close-dialog').addEventListener('click',()=>dialog.close());
    dialog.addEventListener('click',event=>{if(event.target!==dialog)return;const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)dialog.close();});
    dialog.addEventListener('close',()=>{selectedNode=null;renderNodeConversation();const toast=document.getElementById('toast');toast.hidden=true;document.body.append(toast);opener?.focus({preventScroll:true});});
    document.getElementById('zoom-in').addEventListener('click',()=>{fitMode=false;zoom=Math.min(1.5,zoom+.15);applyZoom();});
    document.getElementById('zoom-out').addEventListener('click',()=>{fitMode=false;zoom=Math.max(.3,zoom-.15);applyZoom();});
    document.getElementById('zoom-fit').addEventListener('click',()=>{fitMode=true;applyZoom();});
    document.getElementById('theme-toggle').addEventListener('click',event=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';syncConversationTheme();const label=dark?'切换浅色模式':'切换深色模式';event.currentTarget.title=label;event.currentTarget.setAttribute('aria-label',label);});
    new ResizeObserver(()=>{if(dialog.open)requestAnimationFrame(applyZoom);}).observe(viewport);
    hydrateIcons();renderGroups();renderMonitors();renderCapabilities();
    // Fragment links select a view only; all monitor rows remain collapsed initially.
    if(location.hash==='#terminals')switchTab('terminals');
    if(location.hash==='#capabilities')switchTab('capabilities');
  })();
  </script>
</body>
</html>
