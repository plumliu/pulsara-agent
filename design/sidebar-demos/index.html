<body>
  <div class="lab">
    <header class="lab-header">
      <div class="lab-brand"><span class="lab-number">P / 03</span><div><h1>侧边栏设计实验</h1><small>Pulsara · 三种信息组织方式</small></div></div>
      <nav class="variants" aria-label="比较设计方案">
        <button class="variant" data-layout="a" aria-pressed="true"><b>A</b> 常驻节点侧栏</button>
        <button class="variant" data-layout="b" aria-pressed="false"><b>B</b> 按需活动抽屉</button>
        <button class="variant" data-layout="c" aria-pressed="false"><b>C</b> 独立运行工作区</button>
      </nav>
      <div class="lab-controls"><label class="sr-only" for="scene">模拟使用情境</label><select id="scene"><option value="active">主助手工作中</option><option value="idle">主助手空闲</option><option value="observer">只读观察者</option></select><button class="icon-btn" id="theme" aria-label="切换深色模式" title="切换深色模式">◐</button><button class="icon-btn" id="reset" aria-label="重置演示" title="重置演示">↺</button></div>
    </header>
    <div class="lab-description"><span id="design-description"></span><span class="demo-only">STATIC DEMO / 全部为模拟数据 · 不连接 kernel</span></div>
    <div class="app" id="app"></div>
    <footer class="lab-footer"><span id="design-tradeoff"></span><span class="footer-hint">点击任务或命令查看详情；可模拟取消、终止与重试。</span></footer>
  </div>
  <dialog class="confirmation" id="confirmation" aria-labelledby="confirm-title"><div class="confirm-content"><div class="confirm-kicker">PULSARA · 本地交互演示</div><h3 id="confirm-title"></h3><p id="confirm-copy"></p></div><div class="confirm-footer"><button class="secondary-button" id="dismiss">返回</button><button class="danger-button" id="confirm-action">确认</button></div></dialog>
  <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
  <script>
  (() => {
    'use strict';
    const root = document.getElementById('app');
    const dialog = document.getElementById('confirmation');
    const descriptions = {
      a: ['关系常驻，对话不中断。', '节点图与命令共用右侧栏，选中对象后在下方展开。', 'A · 同时看见对话和任务关系；代价是主对话变窄。'],
      b: ['需要时打开，看完即收起。', '右侧只保留活动入口，详情抽屉覆盖在对话之上。', 'B · 留给对话最多空间；代价是任务关系不常驻。'],
      c: ['把复杂协作放到独立工作区。', '主区容纳完整关系图，右侧看详情，下方管理命令。', 'C · 图与日志空间充足；代价是需要在对话与运行间切换。'],
    };
    const initialTasks = [
      {id:'scope',code:'01',name:'梳理现有协议',status:'completed',model:'主助手',deps:[],description:'核对用户控制与工具结算边界，明确各 owner 的职责。',output:'已确认 3 个用户动作。\n保留现有 permission、settlement 与 provider prefix。'},
      {id:'api',code:'02',name:'实现控制入口',status:'running',model:'子任务 · API',deps:['scope'],description:'接入精确目标的取消请求与原 command 查询，保持副作用结算。',output:'正在整理 Host 的接纳分支…\n已补齐 exact target 参数。'},
      {id:'ui',code:'03',name:'搭建运行面板',status:'running',model:'子任务 · UI',deps:['scope'],description:'组织子任务与后台命令入口，区分控制结果、日志和模型反馈。',output:'已搭建任务详情和只读日志。\n正在验证部分失败的持续提示。',process:'preview'},
      {id:'test',code:'04',name:'验证取消路径',status:'pending',model:'子任务 · 测试',deps:['api'],description:'等待控制入口完成，再验证迟到请求、结算和权限边界。',output:'等待依赖：实现控制入口。'},
      {id:'docs',code:'05',name:'核对交互文案',status:'pending',model:'子任务 · 文档',deps:['ui'],description:'核对停止、取消、终止和未知结果的表述，避免扩大取消范围。',output:'等待依赖：搭建运行面板。'},
      {id:'merge',code:'06',name:'汇总与最终检查',status:'pending',model:'主助手',deps:['test','docs'],description:'汇总测试结果与文案核对，形成可审阅的修改说明。',output:'等待两项前置任务完成。'},
    ];
    const initialProcesses = [
      {id:'preview',title:'本地预览服务',command:'npm run dev:local',status:'running',monitor:true,origin:'本轮 · 搭建运行面板',cwd:'pulsara_agent/frontend',time:'04:32',exit:null,failed:false,gap:false,feedback:'',attempt:0},
      {id:'tests',title:'回归测试',command:'uv run pytest tests/',status:'running',monitor:false,origin:'较早轮次 · 验证基础行为',cwd:'pulsara_agent',time:'12:08',exit:null,failed:true,gap:true,feedback:'上次终止尝试已结束，进程组仍然存活；监视已关闭。',attempt:1},
    ];
    let state;
    let confirmationAction = null;
    const timers = new Set();
    let notificationTimer;
    let graphFrame;
    const iconPaths = {
      chat:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>',
      branch:'<circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M6 9v6m12-6a9 9 0 0 1-9 9"/>',
      terminal:'<path d="m4 6 6 6-6 6m8 0h8"/>',
      folder:'<path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
      check:'<path d="m5 12 4 4L19 6"/>',
      chevron:'<path d="m9 5 7 7-7 7"/>',
      close:'<path d="m6 6 12 12M6 18 18 6"/>',
      clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
      file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8m-8 4h6"/>',
      arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',
    };
    const icon = (name,large=false) => '<svg class="icon'+(large?' large':'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+iconPaths[name]+'</svg>';
    const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const labels = {running:'进行中',completed:'已完成',pending:'等待依赖',cancelled:'已取消',cancelling:'正在取消',blocked:'依赖已中断',stopping:'正在终止',finished:'已结束'};
    const task = id => state.tasks.find(item => item.id === id);
    const process = id => state.processes.find(item => item.id === id);
    const isObserver = () => state.scene === 'observer';
    const canStop = p => !isObserver() && p.status === 'running';
    const schedule = (callback, delay=850) => { const timer = setTimeout(() => {timers.delete(timer);callback();},delay); timers.add(timer); };
    function announce(text){document.getElementById('announcer').textContent = text;}
    function notify(text){
      root.querySelector('.notification')?.remove();
      const el=document.createElement('div');el.className='notification';el.textContent=text;el.setAttribute('role','status');root.append(el);announce(text);
      clearTimeout(notificationTimer);notificationTimer=setTimeout(()=>el.remove(),4000);
    }
    function reset(layout=state?.layout || 'a', scene=document.getElementById('scene').value){
      timers.forEach(clearTimeout);timers.clear();clearTimeout(notificationTimer);confirmationAction=null;if(dialog.open)dialog.close();
      state={layout,scene,tasks:structuredClone(initialTasks),processes:structuredClone(initialProcesses),selectedTask:'api',selectedProcess:'tests',panelTab:'tasks',drawerOpen:false,workspaceTab:'run',selectionKind:'task',rootRunning:scene!=='idle',rootStopping:false};
      render();
    }
    function statusBadge(status){return '<span class="badge '+status+'">'+(status==='running'?'<i class="tiny-dot"></i>':'')+labels[status]+'</span>';}
    function nav(){return '<aside class="global-rail" aria-label="应用导航示意"><span class="brand-symbol">P</span><span class="rail-item active" title="会话">'+icon('chat',true)+'</span><span class="rail-item" title="目录">'+icon('folder',true)+'</span><span class="rail-item" title="记录">'+icon('file',true)+'</span><span class="rail-item rail-bottom">PL</span></aside><aside class="nav"><div class="nav-wordmark">Pulsara</div><section><div class="nav-heading">'+icon('folder')+' 工作目录</div><div class="mono" style="font-size:12px;margin-bottom:10px">pulsara_agent</div><div class="session current">取消与后台命令控制<small>当前会话 · 6 个子任务</small></div><div class="session">梳理工具结果展示<small>昨天 · 已完成</small></div><div class="session">阅读 kernel 架构<small>9 月 8 日 · 已完成</small></div></section><div class="nav-bottom"><b>本地工作区</b><br>演示数据 · 非真实连接</div></aside>';}
    function rootBadge(){return state.rootStopping?'<span class="badge pending">正在停止</span>':state.rootRunning?'<span class="badge running"><i class="tiny-dot"></i>本轮运行中</span>':'<span class="badge">主助手空闲</span>';}
    function topbar(){return '<header class="topbar"><div><h2>取消与后台命令控制</h2><small>pulsara_agent / 当前会话</small></div><div class="topbar-actions">'+(state.layout==='c'?'<div class="view-switch" aria-label="工作区视图"><button data-view="chat" aria-pressed="'+(state.workspaceTab==='chat')+'">对话</button><button data-view="run" aria-pressed="'+(state.workspaceTab==='run')+'">运行 <span class="mono">6</span></button></div>':rootBadge())+(isObserver()?'<span class="badge">'+icon('eye')+' 只读</span>':'')+'</div></header>';}
    function chat(){
      return '<section class="conversation" aria-label="主对话示意"><div class="messages"><div class="thread"><div class="user-label">你 · 14:28</div><div class="user-message">请把取消和后台命令控制接起来。可以拆成子任务并行推进，但不要改变现有的工具结算语义。</div><div class="assistant"><div class="assistant-head"><span class="assistant-logo">P</span><strong>Pulsara</strong><span class="muted">14:28</span></div><div class="assistant-text"><p>我把工作拆成两条并行路径：控制入口和运行面板。对应的验证与文案核对，会等待各自的实现完成。</p><p>我继续处理两边共用的接纳边界，已经启动的后台命令保持独立运行。</p></div><div class="message-tool">'+icon('check')+'<span>读取 <span class="inline-code">conversation_kernel/host.py</span></span><small>已完成</small></div><div class="branch-preview"><h3>6 个子任务 · 两条并行路径</h3><p>实现控制入口 → 验证取消路径<br>搭建运行面板 → 核对交互文案</p><button class="text-action" data-action="show-tasks">查看子任务 '+icon('arrow')+'</button></div><div class="message-tool">'+icon('terminal')+'<span>本地预览服务已转入后台</span><button class="text-action" style="padding:0" data-select-process="preview">查看输出</button></div><div class="live-thought">'+(state.rootStopping?icon('clock')+' 正在停止本轮，等待已启动操作收尾…':state.rootRunning?'<span class="tiny-dot"></span> 正在核对控制请求与反馈的边界…':icon('check')+' 本轮已结束，其他工作保持各自状态。')+'</div></div></div></div><div class="composer-area"><div class="composer"><div class="composer-placeholder">'+(isObserver()?'只读观察模式':'继续对话…（静态演示，输入未接入）')+'</div><div class="composer-row"><div class="composer-meta"><span>OpenRouter</span><span>·</span><span>当前模型</span><span class="permission-label"> / 工作区权限</span></div><button class="stop-root" data-action="stop-root" '+(!state.rootRunning||state.rootStopping||isObserver()?'disabled':'')+' title="停止主助手本轮执行；不自动取消子任务或后台命令"><span class="stop-square"></span>'+(state.rootStopping?'正在收尾':'停止本轮运行')+'</button></div></div><p class="composer-caption">'+(isObserver()?'可以查看日志，不能取消任务或终止命令。':'仅停止所选对象；不会回滚已发生的修改。')+'</p></div></section>';
    }
    function graph(wide=false){
      return '<div class="graph '+(wide?'wide-graph':'')+'" aria-label="子任务依赖图"><svg class="graph-edges" aria-hidden="true"><defs><marker id="arrow-'+(wide?'wide':'compact')+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs></svg>'+state.tasks.map(t=>'<button class="task-node '+(t.id==='scope'?'root-node':t.id==='merge'?'final-node':'')+'" data-node="'+t.id+'" data-select-task="'+t.id+'" aria-pressed="'+(state.selectedTask===t.id&&state.selectionKind==='task')+'" aria-label="'+t.name+'，'+labels[t.status]+'"><span class="node-head"><span>'+t.code+'</span>'+icon(t.status==='completed'?'check':t.status==='pending'?'clock':'branch')+'</span><span class="node-name">'+t.name+'</span><span class="node-status '+t.status+'">'+(t.status==='running'?'<i class="tiny-dot"></i>':'')+labels[t.status]+'</span></button>').join('')+'</div>';
    }
    function taskDetails(){
      const t=task(state.selectedTask);const dependent=state.tasks.filter(item=>item.deps.includes(t.id));const cancellable=['running','pending'].includes(t.status);
      return '<section class="task-details" aria-label="任务详情"><div class="detail-heading"><div><h4>'+t.name+'</h4><small>任务 '+t.code+' · '+t.model+'</small></div>'+statusBadge(t.status)+'</div><p class="detail-copy">'+t.description+'</p><dl class="detail-facts"><dt>依赖</dt><dd>'+(t.deps.length?t.deps.map(id=>'<button data-select-task="'+id+'">'+task(id).name+'</button>').join('、'):'无前置依赖')+'</dd><dt>后续</dt><dd>'+(dependent.length?dependent.map(d=>d.name).join('、'):'无直接依赖任务')+'</dd>'+(t.process?'<dt>命令</dt><dd><button data-select-process="'+t.process+'">'+process(t.process).title+' · '+labels[process(t.process).status]+'</button></dd>':'')+'</dl><div class="detail-output">'+escape(t.output)+'</div>'+(t.status==='blocked'?'<div class="inline-notice warning">前置任务已取消，此任务无法开始。其他无关任务继续。</div>':'')+'<div class="detail-actions"><span class="detail-note">'+(isObserver()?'只读观察者':t.status==='cancelling'?'等待该任务收尾':'仅作用于此任务')+'</span><button class="danger-button" data-cancel-task="'+t.id+'" '+(!cancellable||isObserver()?'disabled':'')+'><span class="stop-square"></span>'+(t.status==='cancelling'?'正在取消':'取消子任务')+'</button></div>'+(t.process?'<p class="detail-note" style="margin-top:10px">取消任务不会自动终止已转入后台的命令。</p>':'')+'</section>';
    }
    function stack(){return '<div class="task-stack">'+state.tasks.map(t=>'<button class="stack-node" data-select-task="'+t.id+'" aria-pressed="'+(t.id===state.selectedTask)+'"><span class="node-symbol">'+t.code+'</span><span><strong>'+t.name+'</strong><small>'+(t.deps.length?'依赖 '+t.deps.map(id=>task(id).code).join('、'):'无前置依赖')+'</small></span>'+statusBadge(t.status)+'</button>').join('')+'</div>';}
    function commandCards(){return '<div class="command-list">'+state.processes.map(p=>'<button class="command-card" data-select-process="'+p.id+'" aria-pressed="'+(state.selectedProcess===p.id&&state.selectionKind==='process')+'"><span class="command-top"><strong>'+escape(p.command)+'</strong>'+statusBadge(p.status)+'</span><span class="command-sub">'+icon('terminal')+' '+p.time+' <span>·</span> '+(p.id==='preview'?'本轮子任务':'较早轮次')+'</span>'+(p.failed?'<span class="command-warning">'+icon('clock')+' 进程仍在运行 · 通知已关闭</span>':'')+'</button>').join('')+'</div>';}
    function retention(){return '<p class="retention">仅显示当前 Host 保留范围，较早记录可能已过期。</p>';}
    function logs(p){
      if(p.id==='preview')return '<span class="time">14:28:16</span>  $ npm run dev:local\n<span class="time">14:28:17</span>  VITE ready in 428 ms\n<span class="ok">➜</span> Local:  http://localhost:5173/\n\n<span class="time">14:29:42</span>  [vite] page updated\n<span class="time">14:30:18</span>  [vite] hmr update\n<span class="time">14:32:48</span>  Waiting for changes…'+(p.status==='finished'?'\n\n<span class="warn">终止请求已完成 · 进程组已退出</span>':'');
      return '<span class="time">14:17:03</span>  $ uv run pytest tests/\n<span class="ok">collected 1686 items</span>\n\ntests/test_control.py ............\ntests/test_terminal.py ..........\n<span class="time">14:28:46</span>  等待子进程清理…\n<span class="warn">14:29:02  终止尝试未完成</span>\n<span class="warn">          进程组仍然存活</span>\n14:29:02  后续监视通知已关闭'+(p.status==='finished'?'\n\n<span class="ok">14:33:10  新终止尝试完成</span>\n          进程组已退出，物理收尾完成':'');
    }
    function processDetails(){
      const p=process(state.selectedProcess);
      return '<section class="log-detail" aria-label="命令详情"><div class="detail-heading"><div><h4>'+p.title+'</h4><small class="mono">process:'+p.id+'</small></div>'+statusBadge(p.status)+'</div><dl class="detail-facts"><dt>来源</dt><dd>'+p.origin+'</dd><dt>目录</dt><dd class="mono">'+p.cwd+'</dd><dt>通知</dt><dd>'+(p.monitor?'已开启 · 进度与完成':'已关闭 · 不再产生新的监视通知')+'</dd><dt>反馈目标</dt><dd>'+(state.rootRunning?'当前主助手 · 本轮 A':'主助手空闲 · 仅更新界面')+'</dd>'+(p.exit!==null?'<dt>退出码</dt><dd class="mono">'+p.exit+'</dd>':'')+'</dl><div class="terminal"><div class="terminal-title"><span>'+icon('terminal')+'</span><span>保留输出 · 只读</span><span>UTF-8</span></div>'+(p.gap?'<div class="log-gap">更早的输出已裁剪 · 当前显示保留片段</div>':'')+'<pre>'+logs(p)+'</pre></div>'+(p.failed?'<div class="persistent-failure"><strong>进程仍在运行 · 通知已关闭</strong><p>上次终止未完成，日志仍可查看。重试会创建一次新的终止操作。</p></div>':'')+(p.feedback?'<div class="feedback-strip"><strong>控制反馈</strong><br>'+escape(p.feedback)+'</div>':'')+'<div class="detail-actions"><span class="detail-note">'+(isObserver()?'只读观察者':p.status==='finished'?'保留输出仍可查看':p.status==='stopping'?'等待物理收尾':'不停止主助手本轮运行')+'</span><button class="danger-button" data-stop-process="'+p.id+'" '+(!canStop(p)?'disabled':'')+'><span class="stop-square"></span>'+(p.failed?'重试终止':p.status==='stopping'?'正在终止':'终止命令')+'</button></div></section>';
    }
    function panel(drawer=false){
      const alert=state.processes.filter(p=>p.failed).length;
      return '<aside class="activity-panel '+(drawer?'drawer-panel':'')+'" aria-label="运行侧栏"><div class="panel-heading"><div><h3>运行</h3><small>当前会话 · 子任务与后台命令</small></div>'+(drawer?'<button class="icon-btn" data-action="close-drawer" aria-label="收起运行抽屉">'+icon('close')+'</button>':icon('branch'))+'</div><p class="mobile-scope-note" hidden>窄屏展示侧栏主体；桌面版与主对话并排。</p><nav class="panel-tabs" aria-label="运行对象类型"><button data-panel="tasks" aria-pressed="'+(state.panelTab==='tasks')+'">子任务 <span class="count">6</span></button><button data-panel="commands" aria-pressed="'+(state.panelTab==='commands')+'">后台命令 <span class="count">2</span>'+(alert?'<span class="count attention-count">'+alert+' 待处理</span>':'')+'</button></nav>'+(isObserver()?'<div class="readonly-note">'+icon('eye')+' 可查看详情与保留日志，控制操作不可用。</div>':'')+'<div class="panel-content">'+(state.panelTab==='tasks'?'<div class="section-row"><strong>本轮任务</strong><span>02、03 并行</span></div>'+(drawer?stack():graph()+'<div class="graph-caption"><span class="edge-legend"><i class="legend-line"></i>箭头指向依赖方</span><span>6 / 6 已加载</span></div>')+taskDetails():commandCards()+retention()+processDetails())+'</div></aside>';
    }
    function activityRail(){const n=state.processes.filter(p=>p.failed).length;return '<aside class="activity-rail" aria-label="活动入口"><button data-panel="tasks" aria-pressed="'+(state.drawerOpen&&state.panelTab==='tasks')+'" aria-label="打开子任务抽屉">'+icon('branch',true)+'<span>任务</span><span class="rail-badge">6</span></button><button data-panel="commands" aria-pressed="'+(state.drawerOpen&&state.panelTab==='commands')+'" aria-label="打开后台命令抽屉">'+icon('terminal',true)+'<span>命令</span>'+(n?'<span class="rail-badge red">'+n+'</span>':'')+'</button></aside>';}
    function workspace(){return '<section class="workspace" aria-label="运行工作区"><div class="workspace-map"><div class="workspace-heading"><div><h3>本轮协作</h3><p>关系是依赖，不是任务创建顺序。</p></div>'+rootBadge()+'</div><div class="map-surface">'+graph(true)+'</div><div class="workspace-summary"><span>箭头指向依赖方</span><span class="status-divider">/</span><span>6 个任务已加载</span><span class="status-divider">/</span><span>选择节点查看详情</span></div><section class="command-dock" aria-label="后台命令"><div class="command-dock-heading"><span>'+icon('terminal')+' 后台命令 <span class="muted">2</span></span><small class="muted">独立于本轮运行</small></div>'+commandCards()+retention()+'</section></div><aside class="workspace-detail" aria-label="选中对象详情"><div class="section-row"><strong>'+(state.selectionKind==='process'?'命令详情':'任务详情')+'</strong><span>当前选中</span></div>'+(isObserver()?'<div class="readonly-note">观察模式 · 仅可读取</div>':'')+(state.selectionKind==='process'?processDetails():taskDetails())+'</aside></section>';}
    function render(){
      const scrollPositions=[...root.querySelectorAll('.panel-content,.workspace-detail,.messages')].map(el=>({selector:'.'+el.className.split(' ')[0],top:el.scrollTop}));
      const [title,description,tradeoff]=descriptions[state.layout];
      document.getElementById('design-description').innerHTML='<strong>'+title+'</strong> '+description;
      document.getElementById('design-tradeoff').textContent=tradeoff;
      document.querySelectorAll('[data-layout]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.layout===state.layout)));
      let content;
      if(state.layout==='c'&&state.workspaceTab==='run')content=workspace();
      else if(state.layout==='a')content=chat()+panel();
      else if(state.layout==='b')content=chat()+activityRail()+(state.drawerOpen?panel(true):'');
      else content=chat()+activityRail()+(state.drawerOpen?panel(true):'');
      root.innerHTML=nav()+'<main class="main">'+topbar()+'<div class="surface layout-'+state.layout+'">'+content+'</div></main>';
      scrollPositions.forEach(({selector,top})=>{const el=root.querySelector(selector);if(el)el.scrollTop=top;});
      cancelAnimationFrame(graphFrame);graphFrame=requestAnimationFrame(drawEdges);
    }
    function drawEdges(){
      root.querySelectorAll('.graph').forEach(container=>{
        const svg=container.querySelector('.graph-edges');const bounds=container.getBoundingClientRect();if(!bounds.width)return;
        svg.setAttribute('viewBox','0 0 '+bounds.width+' '+bounds.height);svg.querySelectorAll('path[data-edge]').forEach(path=>path.remove());
        state.tasks.forEach(t=>t.deps.forEach(id=>{
          const start=container.querySelector('[data-node="'+id+'"]').getBoundingClientRect();const end=container.querySelector('[data-node="'+t.id+'"]').getBoundingClientRect();
          const horizontal=end.left>=start.right+12;const x1=(horizontal?start.right:start.left+start.width/2)-bounds.left;const y1=(horizontal?start.top+start.height/2:start.bottom)-bounds.top;
          const x2=(horizontal?end.left:end.left+end.width/2)-bounds.left;const y2=(horizontal?end.top+end.height/2:end.top)-bounds.top;
          const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('data-edge',id+'-'+t.id);
          path.setAttribute('d',horizontal?'M'+x1+','+y1+' C'+((x1+x2)/2)+','+y1+' '+((x1+x2)/2)+','+y2+' '+x2+','+y2:'M'+x1+','+y1+' C'+x1+','+((y1+y2)/2)+' '+x2+','+((y1+y2)/2)+' '+x2+','+y2);
          if(state.selectionKind==='task'&&(t.id===state.selectedTask||id===state.selectedTask))path.classList.add('highlight');
          path.setAttribute('marker-end','url(#arrow-'+(container.classList.contains('wide-graph')?'wide':'compact')+')');svg.append(path);
        }));
      });
    }
    function showConfirmation(title,copy,label,action){
      document.getElementById('confirm-title').textContent=title;document.getElementById('confirm-copy').textContent=copy;document.getElementById('confirm-action').textContent=label;confirmationAction=action;dialog.showModal();document.getElementById('dismiss').focus();
    }
    function selectTask(id){state.selectedTask=id;state.selectionKind='task';state.panelTab='tasks';if(state.layout!=='a')state.drawerOpen=true;if(state.layout==='c')state.workspaceTab='run';render();root.querySelector('.task-details')?.scrollIntoView({block:'nearest'});}
    function selectProcess(id){state.selectedProcess=id;state.selectionKind='process';state.panelTab='commands';if(state.layout!=='a')state.drawerOpen=true;if(state.layout==='c')state.workspaceTab='run';render();root.querySelector('.log-detail')?.scrollIntoView({block:'nearest'});}
    function cancelTask(id){
      const t=task(id);if(isObserver()||!['running','pending'].includes(t.status))return;
      const direct=state.tasks.filter(item=>item.deps.includes(id));
      showConfirmation('取消“'+t.name+'”？','只取消此子任务。'+(direct.length?'\n依赖它的“'+direct.map(d=>d.name).join('、')+'”将无法开始。':'')+(t.process?'\n它启动的“'+process(t.process).title+'”仍会运行，可单独终止。':'')+'\n其他无关工作不会停止。','取消子任务',()=>{
        t.status='cancelling';render();announce('正在取消 '+t.name);
        schedule(()=>{t.status='cancelled';t.output='用户取消了此子任务。\n已启动的操作已完成收尾。';const blocked=new Set([id]);let changed=true;while(changed){changed=false;state.tasks.forEach(item=>{if(item.status==='pending'&&item.deps.some(dep=>blocked.has(dep))){item.status='blocked';item.output='前置依赖已取消，任务无法开始。';blocked.add(item.id);changed=true;}});}render();notify('已取消“'+t.name+'”；无关任务与后台命令继续运行。');});
      });
    }
    function stopProcess(id){
      const p=process(id);if(!canStop(p))return;
      const targetActive=state.rootRunning;
      showConfirmation((p.failed?'重试终止':'终止')+'“'+p.title+'”？','来源：'+p.origin+'。\n'+(p.monitor?'关闭该命令的后续监视，并终止进程组。':'通知已经关闭，本次只重新尝试终止进程组。')+'\n'+(targetActive?'反馈目标：当前主助手 · 本轮 A（尽力接纳）。':'主助手空闲：仅更新界面，不自动带入下一人工轮次。')+'\n不停止主助手，也不回滚已发生的修改。',p.failed?'重试终止':'终止命令',()=>{
        p.status='stopping';p.failed=false;p.monitor=false;p.attempt+=1;p.feedback='演示操作 #'+p.attempt+' 已接纳，正在等待进程物理收尾。';render();announce('正在终止 '+p.title);
        schedule(()=>{p.status='finished';p.exit=143;p.feedback=targetActive&&state.rootRunning?'进程已结束；控制反馈已记录，待编入本轮 A 的请求。':targetActive?'进程已结束；原轮次 A 已结束，未改投其他轮次。':'进程已结束；仅更新界面，不自动带入下一人工轮次。';render();notify('“'+p.title+'”已结束；保留日志仍可查看。');});
      });
    }
    function stopRoot(){if(!state.rootRunning||state.rootStopping||isObserver())return;state.rootStopping=true;render();schedule(()=>{state.rootRunning=false;state.rootStopping=false;render();notify('本轮已停止。子任务和后台命令未被自动取消。');});}
    root.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button||button.disabled)return;
      if(button.dataset.selectTask)return selectTask(button.dataset.selectTask);
      if(button.dataset.selectProcess)return selectProcess(button.dataset.selectProcess);
      if(button.dataset.cancelTask)return cancelTask(button.dataset.cancelTask);
      if(button.dataset.stopProcess)return stopProcess(button.dataset.stopProcess);
      if(button.dataset.view){state.workspaceTab=button.dataset.view;state.drawerOpen=false;return render();}
      if(button.dataset.panel){state.panelTab=button.dataset.panel;state.selectionKind=state.panelTab==='tasks'?'task':'process';state.drawerOpen=true;return render();}
      if(button.dataset.action==='close-drawer'){state.drawerOpen=false;return render();}
      if(button.dataset.action==='show-tasks'){state.panelTab='tasks';state.selectionKind='task';state.drawerOpen=true;if(state.layout==='c')state.workspaceTab='run';return render();}
      if(button.dataset.action==='stop-root')stopRoot();
    });
    document.querySelectorAll('[data-layout]').forEach(button=>button.addEventListener('click',()=>{state.layout=button.dataset.layout;state.drawerOpen=false;state.workspaceTab='run';history.replaceState(null,'','#'+state.layout);render();announce('切换至方案 '+state.layout.toUpperCase());}));
    document.getElementById('scene').addEventListener('change',()=>reset());
    document.getElementById('theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';document.getElementById('theme').setAttribute('aria-label',dark?'切换浅色模式':'切换深色模式');document.getElementById('theme').title=dark?'切换浅色模式':'切换深色模式';});
    document.getElementById('reset').addEventListener('click',()=>{reset();announce('演示已重置');});
    document.getElementById('dismiss').addEventListener('click',()=>{confirmationAction=null;dialog.close();});
    document.getElementById('confirm-action').addEventListener('click',()=>{const action=confirmationAction;confirmationAction=null;dialog.close();if(action)action();});
    dialog.addEventListener('cancel',()=>{confirmationAction=null;});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!dialog.open&&state.drawerOpen){state.drawerOpen=false;render();}});
    new ResizeObserver(()=>{cancelAnimationFrame(graphFrame);graphFrame=requestAnimationFrame(drawEdges);}).observe(root);
    const layout=location.hash.slice(1);reset(['a','b','c'].includes(layout)?layout:'a');
  })();
  </script>
</body>
</html>
