<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'"><title>Pulsara</title><link rel="stylesheet" href="startup.css">
<body><nav id="window-controls" hidden aria-label="窗口控制"><button id="window-minimize" aria-label="最小化">—</button><button id="window-maximize" aria-label="最大化或还原">□</button><button id="window-close" aria-label="关闭窗口">×</button></nav><main><img class="mark" src="pulsara.png" width="72" height="72" alt=""><h1>Pulsara</h1><p id="status">正在准备本地工作台…</p><p class="hint" hidden></p>
<form id="wsl-setup" hidden><label for="wsl-distribution">已有的 WSL2 Ubuntu</label><select id="wsl-distribution" required></select><p id="wsl-identity" role="status"></p><p>应用资源和数据保存在 Linux 中。保留现有用户、Windows 互操作与自动挂载，不更改发行版的其他设置。</p><button id="wsl-confirm" type="submit" disabled>使用此环境并安装应用资源</button><button id="wsl-refresh" type="button">重新检查</button><p>尚未安装 WSL2 或 Ubuntu？请按 <a href="https://learn.microsoft.com/windows/wsl/install" id="wsl-help">Microsoft 安装说明</a>完成安装后重新检查。</p></form>
<details id="error-details" hidden><summary>技术详情</summary><pre id="error-detail-text"></pre></details><div id="actions" hidden><button id="retry">重试</button><button id="logs">查看日志</button><button id="quit">退出</button></div></main><script src="startup.js"></script></body></html>
