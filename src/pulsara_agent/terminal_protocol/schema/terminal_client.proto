message CancelMcpInteractionCommand { CommandBinding binding = 1; string interaction_id = 2; }
message QueueCancelCommand { CommandBinding binding = 1; string queue_item_id = 2; }
message StartSuccessorSessionCommand { CommandBinding binding = 1; string source_capacity_state_fingerprint = 2; }
message DetachSessionCommand { CommandBinding binding = 1; }
message CloseSessionCommand { CommandBinding binding = 1; bool close_conversation = 2; }
message ControllerTakeoverCommand { CommandBinding binding = 1; uint64 expected_previous_controller_generation = 2; }
message MutationCommand {
  string request_id = 1;
  oneof command {
    SubmitPromptCommand submit_prompt = 2;
    StopRunCommand stop_run = 3;
    ResolveApprovalCommand resolve_approval = 4;
    ResolvePlanQuestionCommand resolve_plan_question = 5;
    ResolvePlanExitCommand resolve_plan_exit = 6;
    ResolveMcpInteractionCommand resolve_mcp_interaction = 7;
    CancelMcpInteractionCommand cancel_mcp_interaction = 8;
    QueueCancelCommand queue_cancel = 9;
    StartSuccessorSessionCommand start_successor_session = 10;
    DetachSessionCommand detach_session = 11;
    CloseSessionCommand close_session = 12;
    ControllerTakeoverCommand controller_takeover = 13;
  }
}
message CommandOutcome {
  string request_id = 1;
  reserved 2;
  reserved "status";
  string command_id = 3;
  string target_id = 4;
  uint64 target_generation = 5;
  string public_result_code = 6;
  string public_result_text = 7;
  repeated string durable_reference_ids = 8;
  string query_token = 9;
  string outcome_fingerprint = 10;
  CommandOutcomeStatus outcome_status = 11;
}
enum CommandOutcomeStatus {
  COMMAND_OUTCOME_STATUS_UNSPECIFIED = 0;
  SUCCEEDED = 1;
  REJECTED = 2;
  PENDING_CONFIRMATION = 3;
  RECONCILIATION_REQUIRED = 4;
  SUPERSEDED_BY_COMPATIBLE_WINNER = 5;
}
message QueryCommandRequest {
  string request_id = 1;
  string runtime_session_id = 2;
  string original_client_instance_id = 3;
  string command_id = 4;
}
message QueryCommandResponse { string request_id = 1; bool found = 2; optional CommandOutcome outcome = 3; }

message TerminalSecretLeaseIdentity {
  string attachment_id = 1;
  uint64 attachment_generation = 2;
  uint64 controller_generation = 3;
  string interaction_id = 4;
  string request_key = 5;
  reserved 6;
  reserved "secret_kind";
  uint64 owner_epoch = 7;
  uint64 lease_generation = 8;
  string expires_at_utc = 9;
  string identity_fingerprint = 10;
  TerminalSecretKind terminal_secret_kind = 11;
}
enum TerminalSecretKind {
  TERMINAL_SECRET_KIND_UNSPECIFIED = 0;
  PRIVATE_URL = 1;
  FORM_RESPONSE = 2;
}
message SecretRevealRequest { string request_id = 1; CommandBinding binding = 2; string interaction_id = 3; string request_key = 4; }
message SecretRevealResult { string request_id = 1; TerminalSecretLeaseIdentity lease_identity = 2; bytes private_url = 3; }
message SecretFormSubmit { string request_id = 1; CommandBinding binding = 2; string interaction_id = 3; string request_key = 4; bytes response_json = 5; }
message SecretSubmitReceipt { string request_id = 1; string sealed_response_handle_id = 2; }
message SecretLeaseRevoked { string request_id = 1; string lease_identity_fingerprint = 2; string stable_reason = 3; }

message ClientFrame {
  oneof request {
    HelloRequest hello = 1;
    AttachRequest attach = 2;
    HeartbeatRequest heartbeat = 3;
    ProjectionSnapshotRequest snapshot = 4;
    ObserveNextRequest observe_next = 5;
    HistoryPageRequest history_page = 6;
    MutationCommand mutation = 7;
    QueryCommandRequest query_command = 8;
    SecretRevealRequest secret_reveal = 9;
    SecretFormSubmit secret_form_submit = 10;
    OperationalSnapshotRequest operational_snapshot = 11;
    AttachReceiptAck attach_ack = 12;
  }
}
message ProtocolError { string request_id = 1; string stable_code = 2; string public_message = 3; }
message ServerFrame {
  oneof response {
    HelloOutcome hello = 1;
    AttachResultReceipt attach = 2;
    HeartbeatResult heartbeat = 3;
    ProjectionSnapshotFrame snapshot = 4;
    OperationalSnapshotFrame operational_snapshot = 5;
    ObservationResponse observation = 6;
    HistoryPageResponse history_page = 7;
    CommandOutcome command_outcome = 8;
    QueryCommandResponse query_command = 9;
    SecretRevealResult secret_reveal = 10;
    SecretSubmitReceipt secret_submit = 11;
    SecretLeaseRevoked secret_revoked = 12;
    ProtocolError error = 13;
    AttachAckResult attach_ack = 14;
  }
}
