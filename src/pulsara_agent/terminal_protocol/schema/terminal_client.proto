syntax = "proto3";

package pulsara.terminal.v2;

option go_package = "github.com/plumliu/pulsara-agent/clients/terminal/internal/protocol;protocol";

// Renderer-neutral local protocol. Durable storage rows and rendering details
// never cross this boundary.

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
  string schema_contract_fingerprint = 3;
  uint32 minimum_compatible_minor = 4;
}

message ProtocolVersionRange {
  uint32 major = 1;
  uint32 minimum_minor = 2;
  uint32 maximum_minor = 3;
  string schema_contract_fingerprint = 4;
}

enum AttachmentRole {
  ATTACHMENT_ROLE_UNSPECIFIED = 0;
  ATTACHMENT_ROLE_OBSERVER = 1;
  ATTACHMENT_ROLE_CONTROLLER = 2;
}

enum TerminalClientCapability {
  TERMINAL_CLIENT_CAPABILITY_UNSPECIFIED = 0;
  PRESENTATION_SNAPSHOT_V1 = 1;
  OPERATIONAL_SNAPSHOT_V1 = 2;
  BOOTSTRAP_CARRIER_V1 = 3;
  LAUNCH_AUTH_PREFACE_V1 = 4;
  ATTACH_ACK_V1 = 5;
  HISTORY_PAGE_V1 = 6;
  OBSERVATION_STREAM_V1 = 7;
  ROOT_ADVANCE_V1 = 8;
  GAP_REBUILD_V1 = 9;
  CONTROL_PROJECTION_OBSERVATION_V1 = 10;
  RECONNECT_AUTH_ROTATION_V1 = 11;
  CLIPBOARD_PUBLIC_TEXT_V1 = 12;
  CONTROLLER_COMMAND_V1 = 13;
  COMMAND_QUERY_V1 = 14;
  TYPED_INTERACTION_ACTIONS_V1 = 15;
  SECRET_FORM_V1 = 16;
  SECRET_PRIVATE_URL_V1 = 17;
  SECRET_REVOKE_V1 = 18;
  PROMPT_QUEUE_MUTATION_V1 = 19;
  SESSION_SUCCESSOR_V1 = 20;
  SERVER_CLOSING_V1 = 21;
}

message TerminalClientBootstrapCarrier {
  uint32 carrier_version = 1;
  string launch_id = 2;
  string client_instance_id = 3;
  string host_session_id = 4;
  string unix_socket_path = 5;
  bytes launch_capability = 6;
  AttachmentRole requested_attachment_role = 7;
  uint64 parent_pid = 8;
  string issued_at_utc = 9;
  string expires_at_utc = 10;
  bytes carrier_nonce = 11;
  string bootstrap_fingerprint = 12;
  string runtime_session_id = 13;
}

message InitialLaunchCredential {
  string launch_id = 1;
  bytes launch_capability = 2;
}

message ReconnectCredential {
  string reconnect_credential_id = 1;
  bytes reconnect_capability = 2;
  string previous_attachment_id = 3;
  uint64 previous_attachment_generation = 4;
}

message TerminalTransportAuthPreface {
  uint32 preface_version = 1;
  string auth_request_id = 2;
  string client_instance_id = 3;
  string handshake_candidate_id = 4;
  string handshake_candidate_fingerprint = 5;
  bytes connection_nonce = 6;
  oneof credential {
    InitialLaunchCredential initial_launch = 7;
    ReconnectCredential reconnect = 8;
  }
  string preface_fingerprint = 9;
}

enum TransportAuthDisposition {
  TRANSPORT_AUTH_DISPOSITION_UNSPECIFIED = 0;
  TRANSPORT_AUTHENTICATED = 1;
  TRANSPORT_COMPATIBLE_AUTH_WINNER = 2;
  TRANSPORT_ACK_RESULT_RECOVERY = 3;
  TRANSPORT_AUTHENTICATION_REJECTED = 4;
}

enum TransportAuthRejectionCode {
  TRANSPORT_AUTH_REJECTION_UNSPECIFIED = 0;
  INVALID_OR_EXPIRED_CREDENTIAL = 1;
  CANDIDATE_CONFLICT = 2;
  AUTH_OWNER_UNAVAILABLE = 3;
}

enum AttachmentTransportRebindDisposition {
  ATTACHMENT_TRANSPORT_REBIND_DISPOSITION_UNSPECIFIED = 0;
  ATTACHMENT_TRANSPORT_REBOUND = 1;
  ATTACHMENT_TRANSPORT_COMPATIBLE_ALREADY_REBOUND = 2;
}

message RecoveredAttachmentTransportBinding {
  string previous_transport_binding_fingerprint = 1;
  TerminalClientTransportBindingIdentity resulting_transport_binding = 2;
  AttachmentTransportRebindDisposition disposition = 3;
  string rebind_receipt_fingerprint = 4;
}

message TerminalTransportAuthResult {
  string auth_request_id = 1;
  string auth_attempt_id = 2;
  string connection_id = 3;
  string client_instance_id = 4;
  string credential_id = 5;
  TransportAuthDisposition disposition = 6;
  optional string authenticated_candidate_fingerprint = 7;
  optional TransportAuthRejectionCode public_rejection_code = 8;
  string result_fingerprint = 9;
  optional AttachAckResult recovered_attach_ack_result = 10;
  optional RecoveredAttachmentTransportBinding recovered_transport_binding = 11;
}

message HandshakeRecoveryCandidateIdentity {
  uint32 candidate_version = 1;
  string candidate_id = 2;
  string client_instance_id = 3;
  uint64 attachment_attempt_generation = 4;
  string host_session_id = 5;
  string requested_runtime_session_id = 6;
  AttachmentRole requested_attachment_role = 7;
  uint32 minimum_protocol_major = 8;
  uint32 minimum_protocol_minor = 9;
  uint32 maximum_protocol_major = 10;
  uint32 maximum_protocol_minor = 11;
  string client_build_identity = 12;
  repeated TerminalClientCapability supported_capabilities = 13;
  repeated TerminalClientCapability required_capabilities = 14;
  string candidate_fingerprint = 15;
  string schema_contract_fingerprint = 16;
}

message HelloRequest {
  string request_id = 1;
  string transport_auth_attempt_id = 2;
  string transport_auth_result_fingerprint = 3;
  HandshakeRecoveryCandidateIdentity handshake_candidate = 4;
}

message NegotiatedLimits {
  uint32 maximum_frame_bytes = 1;
  uint32 maximum_history_page_cells = 2;
  uint32 maximum_history_page_decoded_bytes = 3;
  uint32 maximum_observation_wait_ms = 4;
  uint32 secret_frame_maximum_bytes = 5;
  uint32 maximum_active_queue_items = 6;
  uint32 maximum_server_control_notifications = 7;
  uint32 maximum_operational_activity_cells = 8;
  uint32 maximum_durable_observation_bytes = 9;
  uint32 maximum_operational_observation_bytes = 10;
  uint32 maximum_control_observation_bytes = 11;
  uint32 maximum_observation_batch_bytes = 12;
}

message HeartbeatPolicy {
  uint32 interval_ms = 1;
  uint32 grace_ms = 2;
  uint32 maximum_missed_count = 3;
}

message HelloNegotiationSemanticWinner {
  string handshake_candidate_id = 1;
  string handshake_candidate_fingerprint = 2;
  uint64 attachment_attempt_generation = 3;
  ProtocolVersion selected_protocol = 4;
  string server_build_identity = 5;
  string server_runtime_compatibility_identity = 6;
  NegotiatedLimits negotiated_limits = 7;
  repeated TerminalClientCapability server_supported_capabilities = 8;
  repeated TerminalClientCapability selected_capabilities = 9;
  string capability_contract_fingerprint = 10;
  string negotiation_transcript_fingerprint = 11;
  string negotiation_winner_fingerprint = 12;
}

message ServerHelloReceipt {
  string request_id = 1;
  string transport_auth_attempt_id = 2;
  string handshake_candidate_id = 3;
  string handshake_candidate_fingerprint = 4;
  string negotiation_winner_fingerprint = 5;
  string current_connection_id = 6;
  bytes attachment_challenge = 7;
  string attachment_challenge_commitment = 8;
  string hello_receipt_fingerprint = 9;
}

message ServerHello {
  HelloNegotiationSemanticWinner negotiation_winner = 1;
  ServerHelloReceipt receipt = 2;
}

enum HandshakeCandidateTerminalDisposition {
  HANDSHAKE_CANDIDATE_TERMINAL_DISPOSITION_UNSPECIFIED = 0;
  NEGOTIATION_WINNER_UNAVAILABLE = 1;
  HELLO_REJECTED = 2;
}

enum HelloCandidateTerminalReason {
  HELLO_CANDIDATE_TERMINAL_REASON_UNSPECIFIED = 0;
  FROZEN_WINNER_BINDING_MISSING = 1;
  FROZEN_WINNER_CONTRACT_UNSUPPORTED = 2;
  FROZEN_WINNER_RUNTIME_INCOMPATIBLE = 3;
  PROTOCOL_RANGE_UNSUPPORTED = 4;
  SCHEMA_CONTRACT_UNSUPPORTED = 5;
  MISSING_REQUIRED_CAPABILITY = 6;
  CANDIDATE_EXPIRED = 7;
  SERVER_NEGOTIATION_POLICY_REJECTED = 8;
}

enum HelloCandidateClientDisposition {
  HELLO_CANDIDATE_CLIENT_DISPOSITION_UNSPECIFIED = 0;
  PARENT_RELAUNCH_NEW_CANDIDATE = 1;
  FATAL_COMPATIBILITY = 2;
}

message HandshakeCandidateTerminalReceipt {
  string handshake_candidate_id = 1;
  string handshake_candidate_fingerprint = 2;
  uint64 attachment_attempt_generation = 3;
  HandshakeCandidateTerminalDisposition terminal_disposition = 4;
  HelloCandidateTerminalReason terminal_reason = 5;
  HelloCandidateClientDisposition required_client_disposition = 6;
  optional string prior_negotiation_winner_fingerprint = 7;
  uint64 candidate_registry_revision = 8;
  string terminal_receipt_fingerprint = 9;
}

message HelloNegotiationWinnerUnavailable {
  string request_id = 1;
  string transport_auth_attempt_id = 2;
  string current_connection_id = 3;
  string handshake_candidate_id = 4;
  string handshake_candidate_fingerprint = 5;
  HandshakeCandidateTerminalReceipt candidate_terminal_receipt = 6;
  string outcome_fingerprint = 7;
}

message HelloRejected {
  string request_id = 1;
  string transport_auth_attempt_id = 2;
  string current_connection_id = 3;
  string handshake_candidate_id = 4;
  string handshake_candidate_fingerprint = 5;
  HandshakeCandidateTerminalReceipt candidate_terminal_receipt = 6;
  string outcome_fingerprint = 7;
}

message HelloOutcome {
  oneof outcome {
    ServerHello accepted = 1;
    HelloNegotiationWinnerUnavailable unavailable = 2;
    HelloRejected rejected = 3;
  }
}

message AttachRequest {
  string request_id = 1;
  string handshake_candidate_id = 2;
  string handshake_candidate_fingerprint = 3;
  string negotiation_winner_fingerprint = 4;
  string current_hello_receipt_fingerprint = 5;
  bytes attachment_challenge = 6;
  string attachment_challenge_commitment = 7;
}

message AttachmentIdentity {
  string client_instance_id = 1;
  reserved 2;
  string attachment_id = 3;
  string runtime_session_id = 4;
  uint64 attachment_generation = 5;
  AttachmentRole role = 6;
  uint64 controller_generation = 7;
  string issued_at_utc = 8;
  string expires_at_utc = 9;
  string identity_fingerprint = 10;
}

message TerminalClientTransportBindingIdentity {
  string attachment_id = 1;
  uint64 attachment_generation = 2;
  string connection_id = 3;
  uint64 transport_binding_generation = 4;
  string bound_at_utc = 5;
  string binding_fingerprint = 6;
}

enum ControllerDisposition {
  CONTROLLER_DISPOSITION_UNSPECIFIED = 0;
  CONTROLLER_GRANTED = 1;
  OBSERVER_ATTACHED = 2;
  CONTROLLER_UNAVAILABLE_OBSERVER_ATTACHED = 3;
}

enum BootstrapRequirement {
  BOOTSTRAP_REQUIREMENT_UNSPECIFIED = 0;
  PROJECTION_AND_OPERATIONAL_SNAPSHOT_REQUIRED = 1;
}

message AttachSemanticWinner {
  string handshake_candidate_id = 1;
  string handshake_candidate_fingerprint = 2;
  uint64 attachment_attempt_generation = 3;
  string hello_negotiation_winner_fingerprint = 4;
  AttachmentIdentity attachment = 5;
  ControllerDisposition controller_disposition = 6;
  BootstrapRequirement bootstrap_requirement = 7;
  HeartbeatPolicy heartbeat_policy = 8;
  string semantic_winner_fingerprint = 9;
}

enum AttachResultDisposition {
  ATTACH_RESULT_DISPOSITION_UNSPECIFIED = 0;
  ATTACH_CREATED = 1;
  ATTACH_REBOUND_PRE_ACK = 2;
  ATTACH_COMPATIBLE_ALREADY_REBOUND_PRE_ACK = 3;
}

message AttachResultReceipt {
  string request_id = 1;
  string transport_auth_attempt_id = 2;
  string handshake_candidate_id = 3;
  string handshake_candidate_fingerprint = 4;
  AttachSemanticWinner attach_semantic_winner = 5;
  TerminalClientTransportBindingIdentity current_transport_binding = 6;
  optional string previous_transport_binding_fingerprint = 7;
  AttachResultDisposition disposition = 8;
  string receipt_fingerprint = 9;
}

message AttachReceiptAck {
  string request_id = 1;
  string attachment_id = 2;
  uint64 attachment_generation = 3;
  string semantic_winner_fingerprint = 4;
  TerminalClientTransportBindingIdentity current_transport_binding = 5;
  string attach_result_receipt_fingerprint = 6;
  string ack_fingerprint = 7;
}

enum AttachAckDisposition {
  ATTACH_ACK_DISPOSITION_UNSPECIFIED = 0;
  ATTACH_ACKNOWLEDGED = 1;
  ATTACH_COMPATIBLE_ALREADY_ACKNOWLEDGED = 2;
}

message AttachAckResult {
  string request_id = 1;
  string attachment_id = 2;
  uint64 attachment_generation = 3;
  string semantic_winner_fingerprint = 4;
  string acknowledged_transport_binding_fingerprint = 5;
  AttachAckDisposition disposition = 6;
  string retired_credential_id = 7;
  string ack_result_fingerprint = 8;
}

message HeartbeatRequest {
  string request_id = 1;
  string runtime_session_id = 2;
  string attachment_id = 3;
  uint64 attachment_generation = 4;
  string attachment_identity_fingerprint = 5;
  string attach_semantic_winner_fingerprint = 6;
  TerminalClientTransportBindingIdentity current_transport_binding = 7;
  uint64 heartbeat_generation = 8;
  uint64 previous_accepted_heartbeat_generation = 9;
  string heartbeat_candidate_fingerprint = 10;
  string request_fingerprint = 11;
}

enum HeartbeatLivenessDisposition {
  HEARTBEAT_LIVENESS_DISPOSITION_UNSPECIFIED = 0;
  ATTACHMENT_ACTIVE_LEASE_RENEWED = 1;
  SESSION_CLOSING_LEASE_NOT_RENEWED = 2;
}

enum HeartbeatRejectedReason {
  HEARTBEAT_REJECTED_REASON_UNSPECIFIED = 0;
  STALE_ATTACHMENT = 1;
  STALE_TRANSPORT_BINDING = 2;
  ATTACHMENT_REVOKED = 3;
  ATTACHMENT_EXPIRED = 4;
  SESSION_CLOSED = 5;
}

message HeartbeatAcceptedReceipt {
  string request_id = 1;
  string runtime_session_id = 2;
  string attachment_id = 3;
  uint64 attachment_generation = 4;
  string attachment_identity_fingerprint = 5;
  string attach_semantic_winner_fingerprint = 6;
  string acknowledged_transport_binding_fingerprint = 7;
  uint64 heartbeat_generation = 8;
  uint64 previous_accepted_heartbeat_generation = 9;
  string heartbeat_candidate_fingerprint = 10;
  string resulting_attachment_lease_expires_at = 11;
  HeartbeatLivenessDisposition liveness_disposition = 12;
  string heartbeat_semantic_result_fingerprint = 13;
  string receipt_fingerprint = 14;
}

message HeartbeatRejectedReceipt {
  string request_id = 1;
  string runtime_session_id = 2;
  string attachment_id = 3;
  uint64 attachment_generation = 4;
  string attachment_identity_fingerprint = 5;
  string attach_semantic_winner_fingerprint = 6;
  string submitted_transport_binding_fingerprint = 7;
  uint64 heartbeat_generation = 8;
  uint64 previous_accepted_heartbeat_generation = 9;
  string heartbeat_candidate_fingerprint = 10;
  HeartbeatRejectedReason rejection_reason = 11;
  string heartbeat_semantic_result_fingerprint = 12;
  string receipt_fingerprint = 13;
}

message HeartbeatResult {
  oneof outcome {
    HeartbeatAcceptedReceipt accepted = 1;
    HeartbeatRejectedReceipt rejected = 2;
  }
}

enum PresentationSemanticRole {
  PRESENTATION_SEMANTIC_ROLE_UNSPECIFIED = 0;
  PRESENTATION_SEMANTIC_ROLE_PRIMARY = 1;
  PRESENTATION_SEMANTIC_ROLE_SECONDARY = 2;
  PRESENTATION_SEMANTIC_ROLE_DIAGNOSTIC = 3;
  PRESENTATION_SEMANTIC_ROLE_CODE = 4;
  PRESENTATION_SEMANTIC_ROLE_TOOL_ARGUMENTS = 5;
  PRESENTATION_SEMANTIC_ROLE_TOOL_RESULT = 6;
}

enum PresentationVisibilityPolicy {
  PRESENTATION_VISIBILITY_POLICY_UNSPECIFIED = 0;
  PRESENTATION_VISIBILITY_ALWAYS = 1;
  PRESENTATION_VISIBILITY_NORMAL = 2;
  PRESENTATION_VISIBILITY_DIAGNOSTIC_ONLY = 3;
}

enum PresentationToolResultState {
  PRESENTATION_TOOL_RESULT_STATE_UNSPECIFIED = 0;
  PRESENTATION_TOOL_RESULT_SUCCESS = 1;
  PRESENTATION_TOOL_RESULT_ERROR = 2;
  PRESENTATION_TOOL_RESULT_DENIED = 3;
  PRESENTATION_TOOL_RESULT_INTERRUPTED = 4;
}

enum PresentationInteractionKind {
  PRESENTATION_INTERACTION_KIND_UNSPECIFIED = 0;
  PRESENTATION_INTERACTION_APPROVAL = 1;
  PRESENTATION_INTERACTION_PLAN = 2;
  PRESENTATION_INTERACTION_MCP_INPUT = 3;
  PRESENTATION_INTERACTION_EXTERNAL_INPUT = 4;
}

enum PresentationInteractionState {
  PRESENTATION_INTERACTION_STATE_UNSPECIFIED = 0;
  PRESENTATION_INTERACTION_PENDING = 1;
  PRESENTATION_INTERACTION_RESOLVED = 2;
  PRESENTATION_INTERACTION_CANCELLED = 3;
  PRESENTATION_INTERACTION_FAILED = 4;
}

enum PresentationAuditKind {
  PRESENTATION_AUDIT_KIND_UNSPECIFIED = 0;
  PRESENTATION_AUDIT_RUN_LIFECYCLE = 1;
  PRESENTATION_AUDIT_SUPPRESSED_MODEL_OUTPUT = 2;
  PRESENTATION_AUDIT_PERMISSION = 3;
  PRESENTATION_AUDIT_INTERACTION_LIFECYCLE = 4;
  PRESENTATION_AUDIT_SUBAGENT_LIFECYCLE = 5;
  PRESENTATION_AUDIT_COMPACTION_LIFECYCLE = 6;
  PRESENTATION_AUDIT_RECOVERY_LIFECYCLE = 7;
}

enum PresentationSeverity {
  PRESENTATION_SEVERITY_UNSPECIFIED = 0;
  PRESENTATION_SEVERITY_INFO = 1;
  PRESENTATION_SEVERITY_WARNING = 2;
  PRESENTATION_SEVERITY_ERROR = 3;
}

enum PresentationRelativePositionKind {
  PRESENTATION_RELATIVE_POSITION_KIND_UNSPECIFIED = 0;
  PRESENTATION_RELATIVE_POSITION_BEFORE_FIRST = 1;
  PRESENTATION_RELATIVE_POSITION_BEFORE_LEAF = 2;
  PRESENTATION_RELATIVE_POSITION_CANONICAL_LEAF = 3;
  PRESENTATION_RELATIVE_POSITION_AFTER_LEAF = 4;
  PRESENTATION_RELATIVE_POSITION_LEDGER_GAP = 5;
  PRESENTATION_RELATIVE_POSITION_AFTER_LAST = 6;
}

enum OperationalReplacementSemantics {
  OPERATIONAL_REPLACEMENT_SEMANTICS_UNSPECIFIED = 0;
  OPERATIONAL_REPLACE_SAME_KEY = 1;
  OPERATIONAL_EXPIRE_AT_TERMINAL = 2;
}

enum OperationalRemovalReason {
  OPERATIONAL_REMOVAL_REASON_UNSPECIFIED = 0;
  OPERATIONAL_REMOVAL_DURABLE_TERMINAL = 1;
  OPERATIONAL_REMOVAL_OWNER_REPLACED = 2;
  OPERATIONAL_REMOVAL_EXPLICIT_RETIRE = 3;
}

enum McpInputMode {
  MCP_INPUT_MODE_UNSPECIFIED = 0;
  MCP_INPUT_FORM = 1;
  MCP_INPUT_URL = 2;
}

message EventReferenceView {
  string runtime_session_id = 1;
  string event_id = 2;
  uint64 sequence = 3;
  string event_type = 4;
  string payload_fingerprint = 5;
}

message PresentationTextBlock {
  string text = 1;
  uint64 text_utf8_bytes = 2;
  PresentationSemanticRole semantic_role = 3;
  string block_fingerprint = 4;
}

message PresentationDataBlock {
  string media_type = 1;
  string public_canonical_text = 2;
  uint64 public_utf8_bytes = 3;
  string block_fingerprint = 4;
}

message PresentationContentBlock {
  oneof block {
    PresentationTextBlock text = 1;
    PresentationDataBlock data = 2;
  }
}

message DurableCellCommon {
  string stable_cell_id = 1;
  uint64 semantic_revision = 2;
  repeated EventReferenceView ordered_source_event_references = 3;
  string source_accumulator = 4;
  PresentationVisibilityPolicy visibility_policy = 5;
  repeated PresentationContentBlock content_blocks = 6;
  optional string semantic_group_id = 7;
  string cell_fingerprint = 8;
}

message UserPromptCell { DurableCellCommon common = 1; }
message AssistantMessageCell { DurableCellCommon common = 1; }
message ToolTerminalCell {
  DurableCellCommon common = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  PresentationToolResultState result_state = 4;
}
message ErrorCell {
  DurableCellCommon common = 1;
  string stable_error_code = 2;
}
message InteractionCell {
  DurableCellCommon common = 1;
  PresentationInteractionKind interaction_kind = 2;
  PresentationInteractionState interaction_state = 3;
}
message CompactionBoundaryCell { DurableCellCommon common = 1; }
message RecoveryCell {
  DurableCellCommon common = 1;
  string recovery_kind = 2;
}
message AuditCell {
  DurableCellCommon common = 1;
  PresentationAuditKind audit_kind = 2;
  PresentationSeverity severity = 3;
}
message SystemNoticeCell {
  DurableCellCommon common = 1;
  string notice_kind = 2;
}

message DurableHistoryCell {
  oneof cell {
    UserPromptCell user_prompt = 1;
    AssistantMessageCell assistant_message = 2;
    ToolTerminalCell tool_terminal = 3;
    ErrorCell error = 4;
    InteractionCell interaction = 5;
    CompactionBoundaryCell compaction_boundary = 6;
    RecoveryCell recovery = 7;
    AuditCell audit = 8;
    SystemNoticeCell system_notice = 9;
  }
}

message CanonicalTranscriptSourceView {
  string transcript_leaf_id = 1;
  string transcript_leaf_fingerprint = 2;
  string transcript_anchor_slot_key = 3;
  string transcript_anchor_fingerprint = 4;
  string transcript_reducer_id = 5;
  string transcript_reducer_version = 6;
  string transcript_reducer_contract_fingerprint = 7;
  string source_fold_delta_fingerprint = 8;
  uint64 source_leaf_change_ordinal = 9;
  string source_fingerprint = 10;
}

message DurableAuditSourceView {
  string audit_cell_id = 1;
  uint64 audit_cell_semantic_revision = 2;
  string audit_cell_fingerprint = 3;
  repeated EventReferenceView ordered_source_event_references = 4;
  string presentation_policy_fingerprint = 5;
  string extractor_id = 6;
  string extractor_version = 7;
  string extractor_contract_fingerprint = 8;
  uint64 extractor_output_ordinal = 9;
  string audit_anchor_kind = 10;
  string audit_anchor_fingerprint = 11;
  string source_fingerprint = 12;
}

message HistorySourceView {
  oneof source {
    CanonicalTranscriptSourceView canonical_transcript = 1;
    DurableAuditSourceView durable_audit = 2;
  }
}

message PresentationHistoryPlacementKey {
  string placement_key_contract_id = 1;
  string placement_key_contract_version = 2;
  string placement_key_contract_fingerprint = 3;
  optional uint64 canonical_spine_left_coordinate = 4;
  optional uint64 canonical_spine_right_coordinate = 5;
  PresentationRelativePositionKind relative_position_kind = 6;
  uint64 source_ledger_sequence_or_zero = 7;
  uint32 relative_local_ordinal = 8;
  string stable_source_tiebreaker = 9;
  bytes canonical_comparable_key_bytes = 10;
  string placement_key_fingerprint = 11;
}

message PresentationHistoryEntry {
  string runtime_session_id = 1;
  string history_entry_id = 2;
  PresentationHistoryPlacementKey placement_key = 3;
  HistorySourceView source = 4;
  DurableHistoryCell durable_history_cell = 5;
  string entry_fingerprint = 6;
}

message ConfirmedRootRankBasis {
  string history_root_identity_fingerprint = 1;
  string rank_basis_fingerprint = 2;
}
message ActiveHeadRankBasis {
  string history_active_head_fingerprint = 1;
  uint64 through_authority_sequence = 2;
  string rank_basis_fingerprint = 3;
}
message HistoryRankBasis {
  oneof basis {
    ConfirmedRootRankBasis confirmed_root = 1;
    ActiveHeadRankBasis active_head = 2;
  }
}

message PresentationHistoryRankedEntry {
  PresentationHistoryEntry entry = 1;
  uint64 root_local_display_rank = 2;
  HistoryRankBasis rank_basis = 3;
  string ranked_view_fingerprint = 4;
}

message PresentationHistoryRootIdentity {
  string runtime_session_id = 1;
  string history_projection_contract_fingerprint = 2;
  string materialization_policy_fingerprint = 3;
  string tree_contract_fingerprint = 4;
  string placement_key_contract_id = 5;
  string placement_key_contract_version = 6;
  string placement_key_contract_fingerprint = 7;
  uint64 checkpoint_generation = 8;
  string checkpoint_fingerprint = 9;
  uint64 projection_generation = 10;
  string projection_root_fingerprint = 11;
  uint64 through_authority_sequence = 12;
  uint64 presentation_source_segment_count = 13;
  string presentation_source_prefix_accumulator = 14;
  string presentation_policy_registry_contract_fingerprint = 15;
  string audit_extractor_registry_contract_fingerprint = 16;
  string root_identity_fingerprint = 17;
}

message PresentationHistoryCursor {
  string runtime_session_id = 1;
  PresentationHistoryRootIdentity root_identity = 2;
  optional string anchor_history_entry_id = 3;
  optional PresentationHistoryPlacementKey anchor_placement_key = 4;
  string cursor_fingerprint = 5;
}

message PresentationHistoryLatestRootCursorPair {
  PresentationHistoryRootIdentity root_identity = 1;
  optional PresentationHistoryCursor before_cursor = 2;
  optional PresentationHistoryCursor after_cursor = 3;
  string cursor_pair_fingerprint = 4;
}

message AvailableHistoryCapacity {
  uint64 confirmed_entry_count = 1;
